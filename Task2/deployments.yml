kind: Deployment
apiVersion: apps/v1
metadata:
  name: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
        - name: scaletestapp
          image: shestera/scaletestapp:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              memory: 30Mi