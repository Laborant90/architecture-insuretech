kind: Deployment
apiVersion: apps/v1
metadata:
  name: scaletestapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
      version: v01
  template:
    metadata:
      labels:
        app: scaletestapp
        version: v01
    spec:
      containers:
        - name: scaletestapp
          image: shestera/scaletestapp
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 30Mi